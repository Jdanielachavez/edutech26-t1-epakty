# Cada servicio recibe solo sus variables (mínimo privilegio). Copia env/*.env.example a env/*.env y complétalos.
services:
  api:
    build: .
    env_file: env/api.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8000"]
    volumes: ["./certs:/certs:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "backend.production.worker"]
    env_file: env/worker.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["./certs:/certs:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/proc/1') else 1)"]
      interval: 60s
  n8n:
    # Flujos: borrador con Nova Lite, entrega por correo, contacto y errores. Solo guarda sus credenciales (AWS, SMTP, WhatsApp).
    image: n8nio/n8n@sha256:c349b24d6e242b4ea14d75e6f1a90c50e348cf4b1c4512b4a0a50219ead6533d   # n8n 2.49.5, la versión probada
    env_file: env/n8n.env
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    expose: ["5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
  proxy:
    image: caddy:2.10.2-alpine
    env_file: env/proxy.env
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [api, n8n]
volumes:
  n8n_data:
  caddy_data:
  caddy_config:
